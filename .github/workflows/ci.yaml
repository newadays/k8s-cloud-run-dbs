# Lab 5.1: CI with GitHub Actions, keyless auth to Google Cloud.
#
# Pull request: test, build, scan. Nothing leaves the runner.
# Push to main:  test, build, scan, push by digest, sign, attach an SBOM, then commit the new digest
#                into charts/api/values-staging.yaml. That commit is the hand-off to CD (Lab 5.2, Argo CD).
#                The pipeline never holds cluster credentials.
#
# One-time setup (an account with admin on the repo; see infra-gcp/README.md "CI identity"):
#   gh variable set PROJECT            --body "<project id>"
#   gh variable set REGION             --body "us-central1"
#   gh variable set WIF_PROVIDER       --body "$(terraform -chdir=infra-gcp output -raw wif_provider)"
#   gh variable set CI_SERVICE_ACCOUNT --body "$(terraform -chdir=infra-gcp output -raw ci_service_account)"
# No identifiers are committed here; they come from those repository variables at run time.

name: ci

on:
  push:
    branches: [main]
    paths:
      - "two-tier-app/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "two-tier-app/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read
  id-token: write        # lets the job request a GitHub OIDC token; Google trusts it through the WIF provider

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ${{ vars.REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.PROJECT }}/apps/api
  LOCAL_TAG: api:ci     # the image as built on the runner, before it has a registry name

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        if: github.event_name == 'push'
        run: |
          for v in PROJECT WIF_PROVIDER CI_SERVICE_ACCOUNT; do
            [ -n "${!v}" ] || { echo "::error::repository variable $v is not set"; exit 1; }
          done
        env:
          PROJECT: ${{ vars.PROJECT }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          CI_SERVICE_ACCOUNT: ${{ vars.CI_SERVICE_ACCOUNT }}

      # ---- test ----
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: two-tier-app/requirements-dev.txt
      - name: Unit tests
        working-directory: two-tier-app
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q

      # ---- build (amd64: the GKE nodes are amd64; an arm64 image gave "exec format error" in Lab 4.3) ----
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: two-tier-app
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- scan: fail on fixable HIGH/CRITICAL. ignore-unfixed keeps Debian CVEs with no patch from blocking every build. ----
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.LOCAL_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ---- push, sign, attest: main only ----
      - name: Authenticate to Google Cloud (OIDC, no key)
        if: github.event_name == 'push'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGION || 'us-central1' }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push image
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: two-tier-app
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha      # same layers as the build above, so this is a push, not a rebuild

      - name: Sign image and attach SBOM (keyless: the signature is tied to this workflow's OIDC identity)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
        if: github.event_name == 'push'
      - if: github.event_name == 'push'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          syft "$REF" -o spdx-json > sbom.json
          cosign attest --yes --predicate sbom.json --type spdxjson "$REF"
          echo "signed and attested $REF"

  # The pipeline's last act is a Git commit, not a kubectl apply. That commit is the GitOps boundary.
  # A push made with GITHUB_TOKEN does not trigger workflows, so this cannot loop.
  promote:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write the digest into the staging values file
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          sed -i -E "s|^(  digest:).*|\1 \"${DIGEST}\"   # written by CI on every push to main (.github/workflows/ci.yaml); Lab 5.2 Argo CD reads it from here|" charts/api/values-staging.yaml
          grep -n "digest:" charts/api/values-staging.yaml
      - name: Render the chart with the new digest
        run: helm template api charts/api -f charts/api/values-staging.yaml --set gcp.project=render-check >/dev/null
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/api/values-staging.yaml
          git diff --cached --quiet && { echo "digest unchanged"; exit 0; }
          git commit -m "staging: api image ${{ github.sha }}"
          git push

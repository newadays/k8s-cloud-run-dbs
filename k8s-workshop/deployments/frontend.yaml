apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        track: stable
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 443
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - name: nginx-frontend-conf
              mountPath: /etc/nginx/conf.d
            - name: tls-certs
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: nginx-frontend-conf
          configMap:
            name: nginx-frontend        # kubectl create configmap nginx-frontend --from-file nginx/frontend.conf
        - name: tls-certs
          secret:
            secretName: tls-certs       # kubectl create secret generic tls-certs --from-file tls/

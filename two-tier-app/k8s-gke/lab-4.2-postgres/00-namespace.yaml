# Lab 4.2: Postgres in the cluster as a StatefulSet, so you can argue against it.
# Own namespace, so the NetworkPolicies in two-tier-staging are not involved.
# Secret postgres-credentials is created with kubectl, never committed:
#   kubectl -n pg-lab create secret generic postgres-credentials --from-literal=password="$(openssl rand -base64 18)"
apiVersion: v1
kind: Namespace
metadata: { name: pg-lab }

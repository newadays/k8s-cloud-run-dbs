# Defaults. Environment files (values-staging.yaml, values-prod.yaml) override these.
# Nothing in this chart names a GCP project. Pass it at install time: --set gcp.project=$PROJECT (from .env).

gcp:
  project: ""              # required; the image path, Workload Identity annotation, and Cloud SQL name derive from it
  region: us-central1

replicaCount: 2

image:
  repository: ""   # defaults to <gcp.region>-docker.pkg.dev/<gcp.project>/apps/api
  tag: ""          # defaults to .Chart.AppVersion
  digest: ""       # when set, wins over tag: image: repo@sha256:...
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: api
  gcpServiceAccount: ""  # e.g. api-sa; renders iam.gke.io/gcp-service-account: <name>@<gcp.project>.iam.gserviceaccount.com
  annotations: {}

config:            # becomes a ConfigMap, loaded with envFrom
  DB_HOST: "127.0.0.1"
  DB_NAME: app
  DB_USER: app
  LOG_LEVEL: info

secret:
  name: db-credentials   # existing Secret (created by External Secrets Operator or kubectl); never put the value in values.yaml
  key: password

cloudSqlProxy:
  enabled: true
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
  instance: ""                 # Cloud SQL instance name, e.g. two-tier-db; connection name renders as <gcp.project>:<gcp.region>:<instance>
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

probes:
  readiness: { path: /healthz/ready, periodSeconds: 5 }
  liveness: { path: /healthz/live, initialDelaySeconds: 10 }

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: gce
  host: ""
  managedCertificate: true

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  dbCidr: 10.0.0.0/8

securityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: ["ALL"] }

topologySpread: true

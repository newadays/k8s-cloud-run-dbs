replicaCount: 3
image:
  digest: ""   # required in prod; the pipeline fails if empty (see templates/_helpers.tpl)
serviceAccount:
  gcpServiceAccount: api-sa
cloudSqlProxy:
  instance: two-tier-db
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { memory: 512Mi }
ingress:
  enabled: true
  host: api.example.com
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
podDisruptionBudget:
  minAvailable: 2
networkPolicy:
  enabled: true

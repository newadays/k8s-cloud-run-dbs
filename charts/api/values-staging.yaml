replicaCount: 2
image:
  digest: ""   # written by CI on every push to main (.github/workflows/ci.yaml); Lab 5.2 Argo CD reads it from here
serviceAccount:
  gcpServiceAccount: api-sa
cloudSqlProxy:
  instance: two-tier-db
ingress:
  enabled: false   # no domain for the lab yet; set true with a real host to get a GCLB + managed cert
  host: api-staging.example.com
autoscaling:
  enabled: false
networkPolicy:
  enabled: true

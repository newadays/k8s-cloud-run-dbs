{{- if .Values.ingress.enabled }}
{{- if .Values.ingress.managedCertificate }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "api.fullname" . }}-cert
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  domains:
    - {{ required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className | quote }}
    {{- if .Values.ingress.managedCertificate }}
    networking.gke.io/managed-certificates: {{ include "api.fullname" . }}-cert
    {{- end }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "api.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.gcpServiceAccount .Values.serviceAccount.annotations }}
  annotations:
    {{- with .Values.serviceAccount.gcpServiceAccount }}
    iam.gke.io/gcp-service-account: {{ printf "%s@%s.iam.gserviceaccount.com" . (include "api.project" $) }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

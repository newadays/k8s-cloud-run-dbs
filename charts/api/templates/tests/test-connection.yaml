# helm test <release>: a pod that curls the Service's readiness route and exits 0 or 1.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "api.fullname" . }}-test
  labels:
    {{- include "api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - curl -fsS http://{{ include "api.fullname" . }}:{{ .Values.service.port }}/healthz/ready

# helm test <release>: a pod that curls the Service's readiness route and exits 0 or 1.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "api.fullname" . }}-test
  labels:
    {{- include "api.labels" . | nindent 4 }}
    app.kubernetes.io/component: test   # matched by the -allow-test NetworkPolicy
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded   # keep a failed test pod for `kubectl logs`, but replace it on the next run
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sh", "-c"]
      args:
        - curl -fsS http://{{ include "api.fullname" . }}:{{ .Values.service.port }}/healthz/ready
